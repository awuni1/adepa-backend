<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Payslip</title></head>
<body>
  <h1>Payslip</h1>
  <p>{{ payslip.person.first_name }} {{ payslip.person.last_name }}</p>
  <table border="1" cellpadding="4" cellspacing="0">
    {% for item in payslip.line_items %}
    <tr><td>{{ item.label }}</td><td>{{ item.amount }}</td></tr>
    {% endfor %}
    <tr><td><strong>Net</strong></td><td><strong>{{ payslip.net }}</strong></td></tr>
  </table>
</body>
</html>
